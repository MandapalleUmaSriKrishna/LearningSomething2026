name: SecureML CI

on:
  push:
    branches: [main]
    paths: ['secure-ml-classifier/**', '.github/workflows/secure-ml-ci.yml']
  pull_request:
    paths: ['secure-ml-classifier/**', '.github/workflows/secure-ml-ci.yml']

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secure-ml-classifier/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: secure-ml-classifier/backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check app tests
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secure-ml-classifier/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: secure-ml-classifier/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
